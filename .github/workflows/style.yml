---
name: Code style analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: run code checkers
        env:
          MAVEN_ARGS: "-B -fae"
        run: |
          make install-notests
